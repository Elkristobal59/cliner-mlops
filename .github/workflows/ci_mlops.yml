name: CI/CD & MLOps Pipeline Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Test & MLOps Dependencies
        run: |
          pip install --upgrade pip
          pip install pytest flake8 numpy scipy boto3 mlflow

      - name: 🔍 Syntax & Lint Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,docs,data,models

      - name: 🧪 Run MLOps Continuous Training Pipeline (Simulation & Quality Gate)
        run: |
          python 07_mlops_reentrainement/run_pipeline.py --dry-run --force-retrain

  docker-build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Docker Build Streamlit Frontend
        run: |
          docker build -t cliner-frontend:latest .

      - name: 🐳 Docker Build MLOps Retraining Worker
        run: |
          docker build -t cliner-mlops-worker:latest 07_mlops_reentrainement/
