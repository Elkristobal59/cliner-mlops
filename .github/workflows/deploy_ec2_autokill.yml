name: Deploy EC2 Demo Session (with FinOps Auto-Kill)

on:
  workflow_dispatch:
    inputs:
      session_duration_minutes:
        description: 'Durée maximale de la session de démo avant coupure automatique (FinOps)'
        required: true
        default: '45'
        type: choice
        options:
          - '15'
          - '30'
          - '45'
          - '60'

jobs:
  manage-ec2-session:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install boto3
        run: pip install boto3

      - name: 🚀 Start EC2 GPU Instance
        id: start-ec2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'eu-west-3' }}
          AWS_EC2_GPU_INSTANCE_ID: ${{ secrets.AWS_EC2_GPU_INSTANCE_ID }}
        run: |
          python 07_mlops_reentrainement/ec2_manager.py --action start --instance-id "${AWS_EC2_GPU_INSTANCE_ID}"

      - name: 📢 Announce Demo Session Running
        run: |
          echo "================================================================="
          echo "✨ Instance EC2 GPU démarrée avec succès !"
          echo "⏳ Session active pour : ${{ github.event.inputs.session_duration_minutes }} minutes"
          echo "🔒 L'instance sera automatiquement éteinte à la fin du compte à rebours."
          echo "================================================================="

      - name: ⏱️ Keep Session Alive (Demo Duration)
        run: |
          MINUTES=${{ github.event.inputs.session_duration_minutes }}
          SECONDS=$((MINUTES * 60))
          echo "Minuteur FinOps démarré : veille pendant ${MINUTES} minutes..."
          sleep ${SECONDS}

      - name: 🛑 Auto-Kill EC2 Instance (FinOps Protection)
        if: always() # Toujours exécuté même en cas d'annulation ou d'erreur
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'eu-west-3' }}
          AWS_EC2_GPU_INSTANCE_ID: ${{ secrets.AWS_EC2_GPU_INSTANCE_ID }}
        run: |
          echo "🛑 Déclenchement de l'arrêt de sécurité FinOps..."
          python 07_mlops_reentrainement/ec2_manager.py --action stop --instance-id "${AWS_EC2_GPU_INSTANCE_ID}"
          echo "🔒 Instance éteinte avec succès. Zéro facturation résiduelle."
